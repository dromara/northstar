server:
  ssl:
    key-store-type: JKS
    # 请替换成自己的证书，此仅作代码示例
    key-store: classpath:keystore/demo.jks
    key-store-password: s20ku0o017
    enabled-protocols: TLSv1.2,TLSv1.3
  servlet:
    session:
      cookie:
        same-site: strict
        secure: true
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
northstar: 
  data-service:
    #baseUrl: http://127.0.0.1:443
    baseUrl: https://marketplace.quantit.tech
  rl:
    # RL 模型根目录（相对工作目录；不存在时自动回退 northstar-rl/models 等候选路径）
    models-root: ${NS_RL_MODELS_ROOT:models}
    # Python 解释器（显式配置优先；未配置（python）时自动探测环境脚本安装的 rl-venv，其次系统 python）
    python: ${NS_RL_PYTHON:python}
    # train_round.py 所在目录（缺省按 northstar-rl/training 等候选路径解析）
    training-dir: ${NS_RL_TRAINING_DIR:}
    # 单轮训练执行器：python（生产）/ stub（无 PyTorch 的测试环境）
    train-executor: ${NS_RL_TRAIN_EXECUTOR:python}
    # 训练数据根目录（数据加载阶段落地的 CSV，按任务ID分目录）
    data-root: ${NS_RL_DATA_ROOT:data/rl-training}
    
logging:
  level: 
     root: info
     '[org.dromara.northstar]': info
  file:
    path: logs/
  
spring:
  messages:
    basename: i18n/messages
  jackson:
    deserialization:
      # Jackson 3 默认拒绝 null 赋值给原始类型，恢复 Jackson 2 的宽容行为
      fail-on-null-for-primitives: false
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/storage;DB_CLOSE_ON_EXIT=FALSE;
    driverClassName: org.h2.Driver
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  profiles:
    active: ${env:prod}
  threads:
    virtual:
      enabled: true
---
server:
  port: 443
  ssl:
    enabled: true
spring:
  config:
    activate:
      on-profile: prod,demo
      
---
server:
  port: 80
  ssl:
    enabled: false
spring:
  threads:
    virtual:
      enabled: false
  config:
    activate:
      on-profile: dev

---
server:
  port: 80
  ssl:
    enabled: false
spring:
  datasource:
    url: jdbc:h2:mem:testdb
  config:
    activate:
      on-profile: test,unittest,train,devtest
      
---
server:
  port: 443
  ssl:
    enabled: true
spring:
  datasource:
    url: jdbc:h2:mem:testdb
  config:
    activate:
      on-profile: e2e

